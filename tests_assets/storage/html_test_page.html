<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #bar {
    position: absolute;
    left: 0;
    top: 25%;
    width: 50%;
    height: 50%;
    background: rgba(200, 30, 30, 0.85);
    animation: slide 2s linear infinite;
  }
  @keyframes slide {
    from { transform: translateX(0); }
    to   { transform: translateX(100%); }
  }
</style>
</head>
<body>
<div id="bar"></div>
</body>
</html>
